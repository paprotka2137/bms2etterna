[Global]
FallbackNoteSkin=common

[NoteDisplay]
TapNoteAnimationIsVivid=0
# 0: otherwise taps on the same row as an LN would get the LN head graphic (a cap, after the swap)
DrawHoldHeadForTapsOnSameRow=0
TapNoteAnimationLength=1
HoldHeadAnimationLength=1
HoldTailAnimationLength=1
HoldBodyAnimationLength=1
StartDrawingHoldBodyOffsetFromHead=0
# the grey bar stops where the rounded LN end (Hold Tail) begins
StopDrawingHoldBodyOffsetFromTail=-25
HoldLetGoGrayPercent=0.4
HoldHeadIsAboveWavyParts=1
HoldTailIsAboveWavyParts=1
FlipHeadAndTailWhenReverse=0
FlipHoldBodyWhenReverse=1
TopHoldAnchorWhenReverse=1
TapNoteNoteColorTextureCoordSpacingX=0
TapNoteNoteColorTextureCoordSpacingY=0
HoldHeadNoteColorTextureCoordSpacingX=0
HoldHeadNoteColorTextureCoordSpacingY=0
TapFakeNoteOpacityMultiplier=0.25

[ReceptorArrow]
InitCommand=
NoneCommand=
